
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Marina Minko</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      animation: fadeIn 2.5s ease-out both;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 1500px;
      height: auto;
      margin: 0 auto;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        #000 12%,
        #000 88%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        #000 12%,
        #000 88%,
        transparent 100%
      );
    }

    .status {
      margin-top: clamp(42px, 7vh, 80px);
      color: #222;
      font-size: 14px;
      letter-spacing: 0.38em;
      font-weight: 400;
      text-transform: uppercase;
      animation: fadeIn 2s ease-out 0.8s both;
    }

    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
    }

    .loader span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 60%, 100% {
        opacity: 0.25;
        transform: scale(0.8);
      }
      30% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 24px 18px;
      }

      .status {
        font-size: 11px;
        letter-spacing: 0.25em;
        margin-top: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="./marina-minko.png"
      alt="Marina Minko — elevating the mouthfeel of plant-based cuisine"
    >

    <div class="status">Under Construction</div>

    <div class="loader" role="status" aria-label="Website under construction">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</body>
</html>
